<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="yellowBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
  </defs>
  <!-- Yellow background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#yellowBgGradient)" stroke="#f59e0b" stroke-width="2"/>
  
  <!-- Decorative lines -->
  <!-- Horizontal lines -->
  <line x1="8" y1="16" x2="24" y2="16" stroke="url(#textGradient)" stroke-width="1.5" opacity="0.3"/>
  <line x1="40" y1="16" x2="56" y2="16" stroke="url(#textGradient)" stroke-width="1.5" opacity="0.3"/>
  <line x1="8" y1="48" x2="24" y2="48" stroke="url(#textGradient)" stroke-width="1.5" opacity="0.3"/>
  <line x1="40" y1="48" x2="56" y2="48" stroke="url(#textGradient)" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Vertical lines -->
  <line x1="16" y1="8" x2="16" y2="24" stroke="url(#textGradient)" stroke-width="1.5" opacity="0.3"/>
  <line x1="48" y1="8" x2="48" y2="24" stroke="url(#textGradient)" stroke-width="1.5" opacity="0.3"/>
  <line x1="16" y1="40" x2="16" y2="56" stroke="url(#textGradient)" stroke-width="1.5" opacity="0.3"/>
  <line x1="48" y1="40" x2="48" y2="56" stroke="url(#textGradient)" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Diagonal decorative lines -->
  <line x1="12" y1="12" x2="18" y2="18" stroke="url(#textGradient)" stroke-width="1" opacity="0.2"/>
  <line x1="52" y1="12" x2="46" y2="18" stroke="url(#textGradient)" stroke-width="1" opacity="0.2"/>
  <line x1="12" y1="52" x2="18" y2="46" stroke="url(#textGradient)" stroke-width="1" opacity="0.2"/>
  <line x1="52" y1="52" x2="46" y2="46" stroke="url(#textGradient)" stroke-width="1" opacity="0.2"/>
  
  <!-- S Text - Positioned higher -->
  <text 
    x="32" 
    y="35" 
    font-family="Impact, Arial Black, sans-serif" 
    font-size="48" 
    font-weight="900" 
    fill="url(#textGradient)" 
    text-anchor="middle" 
    dominant-baseline="central"
  >
    S
  </text>
</svg>
